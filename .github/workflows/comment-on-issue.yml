name: "Comment on New Issue"

on:
  issues:
    types: [opened, labeled]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
        type: number

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/comment-on-issue
        with:
          issue_number: ${{ github.event.inputs.issue_number }}
