{% block content %}
<!DOCTYPE html>
<html>

<head>
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      font-family: system-ui, Arial;
      color: white;
    }

    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 50px;
      border-radius: 14px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      background: #4cb39f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚫 Page not found</h1>
    <p>The page you are looking for does not exist.</p>

    <a href="/" onclick="history.back(); return false;">
      ← Go Back
    </a>
  </div>
</body>

</html>
{% endblock %}
