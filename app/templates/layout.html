<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}tiny URL{% endblock %}</title>
  <meta name="description" content="Advanced URL Management Platform">
  <meta property="og:type" content="website">
  <meta property="og:title" content="tiny URL - Precision Shortening">
  <meta property="og:image" content="/static/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Geist+Mono&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/static/css/tiny.css">

  {% block head_extra %}{% endblock %}
</head>

<body class="dark-theme">
  <div class="bg-glow"></div>

  {% include "header.html" %}

  {% block content %}{% endblock %}

  {% include "footer.html" %}

  <script>
    (function applyTheme() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.body.classList.toggle('dark-theme', theme === 'dark');
      document.body.classList.toggle('light-theme', theme === 'light');
    })();

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-theme');
      const next = isDark ? 'light' : 'dark';

      document.body.classList.toggle('dark-theme', next === 'dark');
      document.body.classList.toggle('light-theme', next === 'light');

      localStorage.setItem('theme', next);
    }

  </script>
</body>

</html>
